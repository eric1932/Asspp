name: attestd

on:
  push:
    branches: ["debug/**"]
    paths: ["Tools/attestd/**", ".github/workflows/attestd.yml"]
  workflow_dispatch:

concurrency:
  group: attestd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned ipatool and add asspp-attestd
        run: |
          set -euo pipefail
          commit=$(tr -d '[:space:]' < Tools/attestd/IPATOOL_COMMIT)
          git init -q ipatool
          git -C ipatool remote add origin https://github.com/majd/ipatool.git
          git -C ipatool fetch -q --depth 1 origin "$commit"
          git -C ipatool checkout -q FETCH_HEAD
          mkdir -p ipatool/cmd/asspp-attestd
          cp Tools/attestd/*.go ipatool/cmd/asspp-attestd/
          echo "IPATOOL_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ipatool/go.mod
          cache-dependency-path: ipatool/go.sum

      - name: Vet and test
        working-directory: ipatool
        run: |
          go vet ./cmd/asspp-attestd
          go test -count=1 ./cmd/asspp-attestd

      - name: Build
        working-directory: ipatool
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          out="asspp-attestd-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-X main.version=${GITHUB_SHA::7} -X main.ipatoolCommit=${IPATOOL_COMMIT}" \
            -o "../${out}" ./cmd/asspp-attestd
          file "../${out}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: asspp-attestd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: asspp-attestd-${{ matrix.goos }}-${{ matrix.goarch }}
