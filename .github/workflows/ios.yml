name: ios

# The iOS app as an unsigned IPA, on ios/** branches. It contains no attestation
# plugin: device attestation comes from an asspp-attestd service or from
# AssppAttest.framework (https://github.com/eric1932/asspp-attest), which a user
# adds when signing. Do not publish an IPA with the framework inside.

on:
  push:
    branches: ["ios/**"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label for the app build (macos-15-intel when arm64 capacity is short)"
        required: false
        default: macos-26

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest non-beta Xcode
        run: |
          set -euo pipefail
          best_path=""
          best_ver=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            info="$app/Contents/Info.plist"
            [ -f "$info" ] || continue
            # Skip beta/release-candidate installs.
            case "$(printf '%s' "$app" | tr '[:upper:]' '[:lower:]')" in
              *beta*|*_rc*) continue ;;
            esac
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info" 2>/dev/null || true)"
            [ -n "$ver" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then
              best_ver="$ver"
              best_path="$app"
            fi
          done
          if [ -z "$best_path" ]; then
            echo "::error::No non-beta Xcode found"
            exit 1
          fi
          echo "Selected Xcode $best_ver at $best_path"
          sudo xcode-select -s "$best_path"
          xcodebuild -version

      - name: Ensure iOS platform is installed
        run: xcodebuild -downloadPlatform iOS || true

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Build
        run: |
          set -euo pipefail
          chmod +x Resources/Scripts/compile.release.mobile.ci.sh
          ./Resources/Scripts/compile.release.mobile.ci.sh "$(pwd)" "$RUNNER_TEMP/Asspp.ipa"

      - name: Check that the IPA carries no plugin
        run: |
          set -euo pipefail
          if unzip -l "$RUNNER_TEMP/Asspp.ipa" | grep -q 'AssppAttest'; then
            echo "::error::the IPA contains AssppAttest"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/Asspp.ipa"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$RUNNER_TEMP/Asspp.ipa" "$RUNNER_TEMP/dist/"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Asspp-ios
          path: ${{ runner.temp }}/dist/
