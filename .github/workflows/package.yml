name: ApplePackage

on:
  push:
    branches: ["debug/**"]
    paths: ["Packages/ApplePackage/**", ".github/workflows/package.yml"]
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest non-beta Xcode
        run: |
          set -euo pipefail
          best_path=""
          best_ver=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            info="$app/Contents/Info.plist"
            [ -f "$info" ] || continue
            case "$(printf '%s' "$app" | tr '[:upper:]' '[:lower:]')" in
              *beta*|*_rc*) continue ;;
            esac
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info" 2>/dev/null || true)"
            [ -n "$ver" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then
              best_ver="$ver"
              best_path="$app"
            fi
          done
          [ -n "$best_path" ] || { echo "::error::No non-beta Xcode found"; exit 1; }
          sudo xcode-select -s "$best_path"
          xcodebuild -version
          swift --version

      - name: Build package and tests
        working-directory: Packages/ApplePackage
        run: swift build --build-tests

      - name: Offline tests
        working-directory: Packages/ApplePackage
        run: swift test --skip-build --filter 'DeviceAttestationTests|SAPAuthenticationRequestTests'
